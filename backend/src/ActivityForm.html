<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --text: #1d1d1f; --secondary: #6e6e73; --bg: #f5f5f7; --card: #fff;
      --accent: #0071e3; --accent-hover: #0077ed; --border: #d2d2d7; --error: #d70015;
    }
    @media (prefers-color-scheme: dark) {
      :root { --text: #f5f5f7; --secondary: #a1a1a6; --bg: #000; --card: #1c1c1e;
        --accent: #2997ff; --accent-hover: #47a6ff; --border: #424245; --error: #ff453a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 520px; background: var(--card); border-radius: 18px; padding: 40px 32px; }
    .eyebrow { font-size: 13px; color: var(--secondary); margin: 0 0 8px; }
    h1 { font-size: 32px; line-height: 1.12; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
    .meta { color: var(--secondary); margin: 0 0 28px; }
    textarea {
      width: 100%; min-height: 140px; resize: vertical; padding: 14px 16px; border-radius: 12px;
      border: 1px solid var(--border); background: transparent; color: var(--text); font: inherit;
    }
    textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 12px; }
    .count { font-size: 13px; color: var(--secondary); }
    button {
      border: 0; border-radius: 980px; padding: 12px 24px; font: inherit; color: #fff;
      background: var(--accent); cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: .5; cursor: default; }
    .error { color: var(--error); font-size: 14px; min-height: 20px; margin: 12px 0 0; }
    .done { text-align: center; }
    .check { width: 56px; height: 56px; margin: 0 auto 20px; display: block; }
  </style>
</head>
<body>
<main>
  <? if (state === 'form') { ?>
    <section id="form">
      <p class="eyebrow">AATCE Apple Lab</p>
      <h1>What did you work on?</h1>
      <p class="meta"><?= sessionDate ?><? if (durationMins) { ?> · <?= durationMins ?> min<? } ?></p>
      <textarea id="activity" maxlength="1000" placeholder="e.g. Built the onboarding screen for my SwiftUI app"></textarea>
      <div class="row">
        <span class="count"><span id="count">0</span> / 1000</span>
        <button id="submit" disabled>Submit</button>
      </div>
      <p class="error" id="error" role="alert"></p>
    </section>
    <section id="thanks" class="done" hidden>
      <svg class="check" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="28" fill="#34c759"/><path d="M17 29l7 7 15-16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Thanks.</h1>
      <p class="meta">Your activity has been logged.</p>
    </section>
    <script>
      var sessionId = <?!= JSON.stringify(sessionId) ?>; // validated UUID (Activity.gs)
      var input = document.getElementById('activity');
      var button = document.getElementById('submit');
      var error = document.getElementById('error');
      input.addEventListener('input', function () {
        document.getElementById('count').textContent = input.value.length;
        button.disabled = input.value.trim().length === 0;
      });
      button.addEventListener('click', function () {
        button.disabled = true;
        error.textContent = '';
        google.script.run
          .withSuccessHandler(function () {
            document.getElementById('form').hidden = true;
            document.getElementById('thanks').hidden = false;
          })
          .withFailureHandler(function (err) {
            error.textContent = err.message || 'Something went wrong. Please try again.';
            button.disabled = false;
          })
          .submitActivity(sessionId, input.value);
      });
    </script>
  <? } else if (state === 'done') { ?>
    <section class="done">
      <svg class="check" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="28" fill="#34c759"/><path d="M17 29l7 7 15-16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Already logged.</h1>
      <p class="meta">You've already told us what you worked on in this session.</p>
    </section>
  <? } else { ?>
    <section class="done">
      <h1>Link not valid.</h1>
      <p class="meta">This activity link has expired or doesn't exist.</p>
    </section>
  <? } ?>
</main>
</body>
</html>
