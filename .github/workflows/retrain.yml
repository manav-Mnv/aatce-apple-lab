name: Retrain embeddings

# Weekly: download face photos through the backend → generate embeddings →
# publish them through the backend. Nothing biometric is committed, cached or
# uploaded as an artifact (the repo is public).
on:
  schedule:
    - cron: '30 21 * * 6'   # Sunday 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    env:
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
    defaults:
      run:
        working-directory: ml-training
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: config
        run: |
          if [ -z "$APPS_SCRIPT_URL" ] || [ -z "$PIPELINE_SECRET" ]; then
            echo "::notice::APPS_SCRIPT_URL / PIPELINE_SECRET secrets are not set — skipping (see docs/SETUP.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-training/requirements.txt

      - name: Cache FaceNet weights (public pretrained model, not student data)
        if: steps.config.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: facenet-vggface2-v1

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Download face photos
        if: steps.config.outputs.ready == 'true'
        run: python -m src.sync_faces --dataset-dir "$RUNNER_TEMP/Face-Dataset"

      - name: Generate embeddings
        if: steps.config.outputs.ready == 'true'
        run: python -m src.pipeline --dataset-dir "$RUNNER_TEMP/Face-Dataset" --output "$RUNNER_TEMP/embeddings.json"

      - name: Publish
        if: steps.config.outputs.ready == 'true'
        run: python -m src.publish --input "$RUNNER_TEMP/embeddings.json"

      - name: Remove local copies
        if: always()
        run: rm -rf "$RUNNER_TEMP/Face-Dataset" "$RUNNER_TEMP/embeddings.json"
