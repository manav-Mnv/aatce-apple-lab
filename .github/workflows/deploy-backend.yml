name: Deploy backend

# Pushes backend/src to Apps Script and publishes it as a new version of the
# existing web-app deployment (same URL), after the tests pass. Then checks the
# live backend reports the version in Main.gs — so GitHub and the live backend
# can never silently drift apart. Setup: docs/SETUP.md §3.9.
on:
  push:
    branches: [ main, master ]
    paths: [ 'backend/src/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test
        run: node tests/test_backend.js

      - name: Check configuration
        id: config
        run: |
          for v in CLASPRC_JSON SCRIPT_ID DEPLOYMENT_ID APPS_SCRIPT_URL PIPELINE_SECRET; do
            if [ -z "${!v}" ]; then
              echo "::notice::Secret for $v is not set — skipping deploy (see docs/SETUP.md §3.9)."
              echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Push and publish a new version
        if: steps.config.outputs.ready == 'true'
        run: |
          npm install -g @google/clasp@3.4.1
          printf '%s' "$CLASPRC_JSON" > "$RUNNER_TEMP/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"src"}' "$SCRIPT_ID" > .clasp.json
          clasp -A "$RUNNER_TEMP/.clasprc.json" push --force
          clasp -A "$RUNNER_TEMP/.clasprc.json" update-deployment "$DEPLOYMENT_ID" --description "CI ${GITHUB_SHA::7}"

      - name: Check the live backend runs this version
        if: steps.config.outputs.ready == 'true'
        run: |
          expected=$(grep -oP "API_VERSION = '\K[^']+" src/Main.gs)
          for attempt in 1 2 3 4 5; do
            got=$(curl -sL -H 'Content-Type: application/json' \
              -d "{\"secret\":\"$PIPELINE_SECRET\",\"action\":\"status\"}" "$APPS_SCRIPT_URL" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin).get("version",""))' || true)
            echo "attempt $attempt: live=$got expected=$expected"
            [ "$got" = "$expected" ] && exit 0
            sleep 10
          done
          echo "::error::Live backend reports '$got', expected '$expected'."
          exit 1

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/.clasprc.json" .clasp.json
