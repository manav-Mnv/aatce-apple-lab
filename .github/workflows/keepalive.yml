name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity. The kiosk calls the
# API every minute while the lab is open; this covers holidays.
on:
  schedule:
    - cron: '17 6 */3 * *'   # every 3 days
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
    steps:
      - name: Ping the API
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$PIPELINE_SECRET" ]; then
            echo "::notice::Supabase secrets are not set — nothing to ping."; exit 0
          fi
          curl -sf -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" \
            -d "{\"secret\":\"$PIPELINE_SECRET\",\"action\":\"status\"}" \
            "$SUPABASE_URL/rest/v1/rpc/api" | grep -q '"success": *true'
          echo "Supabase is awake."
