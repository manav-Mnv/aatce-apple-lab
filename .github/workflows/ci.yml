name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  macos-app-build:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build placeholder
        run: echo "xcodebuild goes here when Xcode project is initialized"

  backend-build:
    name: Test Backend (Apps Script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run backend unit tests
        run: node tests/test_backend.js
        working-directory: backend

  ml-training-build:
    name: Test ML Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ml-training
      - name: Run tests
        run: python -m pytest tests/ -v
        working-directory: ml-training

  admin-portal-build:
    name: Build Admin Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build placeholder
        run: echo "npm run build goes here when Node project is initialized"
