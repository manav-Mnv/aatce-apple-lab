name: CI

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Apps Script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/test_backend.js
        working-directory: backend

  ml-training:
    name: ML pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
        working-directory: ml-training
      - run: python -m pytest -q
        working-directory: ml-training

  macos-app:
    name: Kiosk app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build
        working-directory: macos-app
      - run: swift test
        working-directory: macos-app
      - run: ./scripts/build-app.sh
        working-directory: macos-app

  admin-portal:
    name: Admin portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-portal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
