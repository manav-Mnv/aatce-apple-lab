name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  macos-app-build:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build placeholder
        run: echo "xcodebuild goes here when Xcode project is initialized"

  backend-build:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build placeholder
        run: echo "go build ./... goes here when Go module is initialized"

  ml-training-build:
    name: Build ML Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build placeholder
        run: echo "pytest or pylint goes here when Python project is initialized"

  admin-portal-build:
    name: Build Admin Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build placeholder
        run: echo "npm run build goes here when Node project is initialized"
